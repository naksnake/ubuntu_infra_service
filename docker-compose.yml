services:

  # ── Web file server (iPXE scripts + ISO/kernel share) ──────────────────────
  webfs:
    build: ./services/webfs
    container_name: lab_webfs
    ports:
      - "${UI_BIND:-0.0.0.0}:${WEBFS_PORT:-8080}:8080"
    volumes:
      # webfsd only serves files; mount everything read-only so a compromised
      # file server cannot tamper with boot assets (uploads are written by the
      # iPXE Manager through its own rw mount of the same directory).
      - ./services/webfs/htdocs:/var/www/htdocs:ro
      - ./ipxe:/var/www/htdocs/ipxe:ro
      - ./data/webfs_share:/var/www/htdocs/files:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Optional HTTPS listener for the file share (compose profile "https") ───
  # Same image and content as webfs, served with TLS by webfsd itself.
  # Enable with COMPOSE_PROFILES=https in .env; deploy.sh generates a
  # self-signed cert into data/certs/webfs.pem on the next run (or provide
  # your own chained PEM: certificate first, then the private key).
  # Keep PXE boot on plain HTTP — stock iPXE will not trust a self-signed cert.
  webfs-https:
    build: ./services/webfs
    container_name: lab_webfs_https
    profiles: ["https"]
    # -m matches the plain-HTTP listener: unknown extensions (.run, …) download
    # as octet-stream instead of rendering as text
    command: ["webfsd", "-F", "-p", "8443", "-r", "/var/www/htdocs", "-f", "index.html", "-S", "-C", "/etc/webfs/webfs.pem", "-m", "application/octet-stream"]
    ports:
      - "${UI_BIND:-0.0.0.0}:${WEBFS_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./services/webfs/htdocs:/var/www/htdocs:ro
      - ./ipxe:/var/www/htdocs/ipxe:ro
      - ./data/webfs_share:/var/www/htdocs/files:ro
      # directory mount, NOT a single-file mount — a bare `docker compose up`
      # would auto-create a missing pem file as a directory
      - ./data/certs:/etc/webfs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O- https://127.0.0.1:8443/files/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── TFTP server (bootloader delivery) ──────────────────────────────────────
  tftp:
    build: ./services/tftp
    container_name: lab_tftp
    network_mode: host
    volumes:
      - ./services/tftp/tftpboot:/srv/tftp:rw
    healthcheck:
      # check the daemon is actually running, not merely that the dir exists
      test: ["CMD-SHELL", "pgrep in.tftpd >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── DHCP + PXE (dnsmasq, host network required) ────────────────────────────
  dhcp:
    build: ./services/dhcp
    container_name: lab_dhcp
    network_mode: host
    environment:
      - PXE_IFACE=${PXE_IFACE}
      - PXE_RANGE_START=${PXE_RANGE_START}
      - PXE_RANGE_END=${PXE_RANGE_END}
      - PXE_NETMASK=${PXE_NETMASK}
      - PXE_LEASE_TIME=${PXE_LEASE_TIME:-12h}
      - PXE_ROUTER_IP=${PXE_ROUTER_IP}
      - DNS_SERVER=${DNS_SERVER}
      # IPv6 on the lab segment — opt-in, IPv4-only by default (see .env.example)
      - PXE_ENABLE_IPV6=${PXE_ENABLE_IPV6:-0}
      - PXE_IPV6_RANGE_START=${PXE_IPV6_RANGE_START:-}
      - PXE_IPV6_RANGE_END=${PXE_IPV6_RANGE_END:-}
      - PXE_IPV6_PREFIX_LEN=${PXE_IPV6_PREFIX_LEN:-64}
      - WEBFS_HOST_IP=${WEBFS_HOST_IP}
      - WEBFS_PORT=${WEBFS_PORT:-8080}
      - TFTP_SERVER_IP=${TFTP_SERVER_IP}
      - IPXE_MANAGER_PORT=${IPXE_MANAGER_PORT:-8091}
    volumes:
      - ./services/dhcp/dnsmasq.conf.template:/etc/dnsmasq.conf.template:ro
      # fixed IP-to-MAC reservations; edit then `docker compose restart dhcp`
      - ./services/dhcp/static-hosts.conf:/etc/dnsmasq-static-hosts.conf:ro
      - ./data/dnsmasq.leases:/data/dnsmasq.leases:rw
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "kill -0 $(cat /var/run/dnsmasq.pid 2>/dev/null) 2>/dev/null || pgrep dnsmasq >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── iPXE Manager (boot entry editor + file uploads) ───────────────────────
  ipxe-manager:
    build: ./services/ipxe_manager
    container_name: lab_ipxe_manager
    ports:
      - "${UI_BIND:-0.0.0.0}:${IPXE_MANAGER_PORT:-8091}:8091"
    volumes:
      - ./data/webfs_share:/data/uploads:rw
      # directory mount, NOT a single-file mount — save_entries() renames a
      # temp file over entries.json, which fails with EBUSY on a file mount
      - ./data/ipxe_manager:/data/state:rw
    environment:
      - UPLOAD_DIR=/data/uploads
      - ENTRIES_FILE=/data/state/entries.json
      - AUTOINSTALL_FILE=/data/state/autoinstall.json
      - WEBFS_BASE=http://${WEBFS_HOST_IP:-192.168.100.1}:${WEBFS_PORT:-8080}
      - SERVER_IP=${WEBFS_HOST_IP:-192.168.100.1}
      # base URL PXE clients use to fetch the autoinstall seed — must point at
      # this manager (host:published-port), which serves /autoinstall/<id>/
      - MANAGER_BASE=http://${WEBFS_HOST_IP:-192.168.100.1}:${IPXE_MANAGER_PORT:-8091}
      # admin account for the manager UI/API (auth active once the password is set)
      - AUTH_USER=${IPXE_MANAGER_USER:-admin}
      - AUTH_PASSWORD=${IPXE_MANAGER_PASSWORD:-}
      # APT caching proxy injected into every autoinstall seed
      - IPXE_APT_PROXY=${IPXE_APT_PROXY:-http://${WEBFS_HOST_IP:-192.168.100.1}:3142}
    healthcheck:
      # /menu.ipxe stays reachable even when IPXE_MANAGER_PASSWORD is set
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/menu.ipxe')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Docker API proxy (read-only, for the monitor) ─────────────────────────
  # The monitor must never hold the raw docker.sock: the socket's API is
  # root-equivalent on the host regardless of a :ro mount (ro only protects
  # the socket file, not what the API will do), and the monitor also carries
  # the CCP/iPXE-Manager admin credentials in its environment. This HAProxy
  # proxy exposes exactly the read-only endpoints the dashboard uses —
  # container list/inspect and image name lookup — and denies everything
  # else (POST/DELETE, exec, volumes, networks, ...). It lives on an
  # internal-only network that just the monitor can reach.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: lab_docker_proxy
    environment:
      - CONTAINERS=1   # GET /containers/* (list + inspect)
      - IMAGES=1       # GET /images/*    (dashboard shows image names)
      - POST=0         # no write methods, ever
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    restart: unless-stopped

  # ── Monitor dashboard (service health + DHCP lookup) ──────────────────────
  monitor:
    build: ./services/monitor
    container_name: lab_monitor
    ports:
      - "${UI_BIND:-0.0.0.0}:${MONITOR_PORT:-8090}:8090"
    volumes:
      - ./data/dnsmasq.leases:/data/dnsmasq.leases:ro
    networks:
      - default
      - docker-api
    depends_on:
      - docker-socket-proxy
    environment:
      # container status comes through the read-only socket proxy above —
      # docker.from_env() honors DOCKER_HOST, no code change needed
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - LEASES_FILE=/data/dnsmasq.leases
      - REFRESH_INTERVAL=${MONITOR_REFRESH:-30}
      # ports for the dashboard quick-links (host-relative in the browser)
      - WEBFS_PORT=${WEBFS_PORT:-8080}
      - IPXE_MANAGER_PORT=${IPXE_MANAGER_PORT:-8091}
      - CCP_PORT=${CCP_PORT:-8060}
      # dashboard uploads are proxied to the iPXE Manager (compose-internal
      # address — the in-container port is fixed at 8091), so ISO uploads get
      # the same kernel/initrd extraction + auto boot entry as manager uploads
      - IPXE_MANAGER_URL=http://ipxe-manager:8091
      - IPXE_MANAGER_USER=${IPXE_MANAGER_USER:-admin}
      - IPXE_MANAGER_PASSWORD=${IPXE_MANAGER_PASSWORD:-}
      # login + RBAC for the dashboard (admin reuses the Control Panel login by
      # default; set MONITOR_VIEWER_PASSWORD to add a read-only account)
      - MONITOR_SECRET_KEY=${MONITOR_SECRET_KEY}
      - MONITOR_ADMIN_USER=${CCP_ADMIN_USER:-admin}
      - MONITOR_ADMIN_PASSWORD=${CCP_ADMIN_PASSWORD}
      - MONITOR_VIEWER_USER=${MONITOR_VIEWER_USER:-viewer}
      - MONITOR_VIEWER_PASSWORD=${MONITOR_VIEWER_PASSWORD:-}
      - MONITOR_SESSION_MINUTES=${MONITOR_SESSION_MINUTES:-30}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Cluster Control Panel (ClusterShell + Ansible web UI) ──────────────────
  ccp:
    build: ./services/ccp
    container_name: lab_ccp
    ports:
      - "${UI_BIND:-0.0.0.0}:${CCP_PORT:-8060}:8060"
    volumes:
      # single directory bind mount holds the SQLite db, job logs, uploaded
      # files and the SSH key — no single-file mounts (which Docker would
      # auto-create as directories on a bare `docker compose up`)
      - ./data/ccp:/data/ccp:rw
      # dnsmasq lease database (written by lab_dhcp) — read-only source for
      # the Discovery page; deploy.sh pre-creates the file so this mount
      # never auto-creates a directory
      - ./data/dnsmasq.leases:/data/dnsmasq.leases:ro
    environment:
      - CCP_SECRET_KEY=${CCP_SECRET_KEY}
      - CCP_ADMIN_USER=${CCP_ADMIN_USER:-admin}
      - CCP_ADMIN_PASSWORD=${CCP_ADMIN_PASSWORD}
      - CCP_DEMO=${CCP_DEMO:-0}
      - CCP_DB=/data/ccp/ccp.db
      - CCP_JOBS_DIR=/data/ccp/jobs
      - CCP_FILES_DIR=/data/ccp/files
      # default per-user storage quota in MB (0 = unlimited); users.quota_mb
      # overrides per user
      - CCP_USER_QUOTA_MB=${CCP_USER_QUOTA_MB:-10240}
      - CCP_SSH_KEY=/data/ccp/ssh/id_ccp
      - CCP_LEASES_FILE=/data/dnsmasq.leases
      # hard per-job wall-clock cap (seconds) so a hung command/playbook can't
      # pin a worker thread forever
      - CCP_JOB_TIMEOUT=${CCP_JOB_TIMEOUT:-900}
    healthcheck:
      # in-container port is fixed at 8060; /healthz needs no login
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8060/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 8s
    restart: unless-stopped

  # ── APT caching proxy (apt-cacher-ng) ─────────────────────────────────────
  # Caches .deb downloads for unattended installs. The iPXE Manager injects
  # http://<host>:3142 into every autoinstall seed (IPXE_APT_PROXY), so the
  # first install fills the cache and the rest are served from the LAN —
  # lower latency, higher throughput, less WAN traffic. Cache persists under
  # ./data/apt_cacher_ng across restarts.
  apt-cacher-ng:
    build: ./services/apt_cacher_ng
    container_name: lab_apt_cacher_ng
    ports:
      - "${APT_CACHER_BIND:-0.0.0.0}:${APT_CACHER_PORT:-3142}:3142"
    volumes:
      - ./data/apt_cacher_ng:/var/cache/apt-cacher-ng:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3142/acng-report/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  # carries only monitor→docker-socket-proxy traffic; internal: no route out,
  # and no other container joins it
  docker-api:
    internal: true
