# Demo lab rack layout for CCP (Rack View -> Rack layout file -> Preview -> Apply).
# 2 GPU racks x 8 sleds + 1 CPU/storage rack. Machines are matched by mac
# (preferred), hostname or ip; hostname is the name given on Discovery import.
# Storage nodes have no planned hostname: placed by MAC, keep their own name.
